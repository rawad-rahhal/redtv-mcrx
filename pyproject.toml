[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "redtv-mcrx"
version     = "4.16.2"
description = "RED TV MCRX v4.16.2 — Deterministic broadcast playout and master-control foundation"
readme      = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.5,<3",
    "pyyaml>=6.0",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    # Media (optional — graceful degradation without them)
    # "av>=11.0",
    # "numpy>=1.26",
    # "Pillow>=10.0",
]

[project.optional-dependencies]
media = [
    "av>=11.0",
    "numpy>=1.26",
    "Pillow>=10.0",
]
desktop = [
    "PyQt6>=6.6",
    "PyQt6-WebSockets>=6.6",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "ruff>=0.1",
    "mypy>=1.7",
]
all = [
    "redtv-mcrx[media,desktop,dev]",
]

[project.scripts]
redtv-gateway  = "api_gateway.main:main"
redtv-ingest   = "media_factory.main:main"
redtv-nashra   = "automation_ai.main:main"
redtv-playout  = "playout_core.main:main"
redtv-desktop  = "operator_ui.desktop_client:main"
redtv-soak     = "scripts.soak_test:main"

[tool.setuptools.packages.find]
where   = ["."]
include = [
    "shared_contracts*",
    "playout_core*",
    "media_factory*",
    "automation_ai*",
    "api_gateway*",
    "operator_ui*",
    "live_ingest*",
    "program_renderer*",
    "config*",
    "scripts*",
]

[tool.setuptools.package-data]
config = ["*.yaml", "presets/*.yaml", "schemas/*.json"]
operator_ui = ["*.html"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
